<!--Hovedfilen som starter applikasjonen og styrer navigasjonen-->

<!doctype html>
<html lang="en">

<head>
  <link rel="stylesheet" href="./user.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sukkergris</title>
</head>

<body>

  <header class="site-header">
    <button id="homeButton" aria-label="Home" type="button">
      <img src="./assets/home.svg" alt="" />
    </button>

    <button id="userMenuButton" type="button" aria-label="Account">
      <img src="./assets/loginIcon.png" alt="" />
    </button>
    <div id="userMenu" hidden>
      <div id="loggedOut">
      <h2>Account</h2>
      <button id="createUserButton" type="button">Create User</button>
      <button id="loginButton" type="button">Login</button>
      </div>
      <div id="loggedIn" hidden>
      <h2>User Settings</h2>
      <button id="editUserButton" type="button">Edit user information</button>
      <button id="deleteUserButton" type="button">Delete Account</button>
      <button id="logoutButton" type="button">Log out</button>
      </div>
    </div>


    <h1 id="homeTitle" tabindex="0" role="button">Sukkergris</h1>
    <button id="cartButton" type="button" aria-label="Shopping cart">
      <img src="./assets/cart.svg" alt="" />
    </button>
  </header>

  <script type="module" src="./modules/user_app/user_main.mjs">

  </script>

</body>

</html>
